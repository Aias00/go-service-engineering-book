name: Build, verify and publish book
on:
  push:
    branches: [main]
    paths:
      - book/**
      - lab/**
      - scripts/**
      - web/**
      - epub/**
      - README.md
      - LICENSE
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: book-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: '3.12.1'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify manuscript scope
        run: python3 scripts/check-manuscript.py
      - name: Race and static checks
        working-directory: lab
        run: |
          go version
          go env GOOS GOARCH CGO_ENABLED
          go vet ./...
          go test -race -v ./...
      - name: Repeat bounded failure and real SIGTERM experiments
        working-directory: lab
        run: |
          go test -race ./internal/service -run 'Test(PoolQueueBound|PoolBlockedCancellationReleases|PoolConcurrentCloseAndSubmit|ConnectionExhaustionAndRecovery|FetcherBlockedBodyCancellationReleasesConnection|SlowStreamDeadlineReleasesHandler|DrainRequestsWaitsForHandlerAndGatesAdmission)$' -count=30 -timeout=60s
          go test -race ./cmd/service -run TestSIGTERM -count=10 -timeout=60s
      - name: Run benchmark and parse real profiles
        working-directory: lab
        run: |
          mkdir -p evidence
          go test ./internal/service -run '^$' -bench BenchmarkPoolSubmit -benchmem -count=3
          go test ./internal/service -run '^$' -bench BenchmarkPoolSubmit -benchtime=2s -benchmem -cpuprofile evidence/ci.cpu.pprof -memprofile evidence/ci.heap.pprof -o evidence/service.test
          go tool pprof -top evidence/ci.cpu.pprof
          go tool pprof -top -alloc_space evidence/ci.heap.pprof
      - name: Build and verify same-source reading formats
        run: |
          python3 scripts/build.py
          python3 scripts/verify.py
          sh scripts/epubcheck.sh
      - name: Run ZIP independently
        run: |
          unzip -q site/downloads/lab.zip -d /tmp/go-service-independent
          cd /tmp/go-service-independent
          go test -race ./...
      - name: Install browser tools
        run: |
          npm install --no-save --package-lock=false playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Verify interactions and every chapter on mobile
        run: |
          python3 -m http.server 8767 --bind 127.0.0.1 --directory site > /tmp/book-http.log 2>&1 &
          node scripts/browser-check.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: book-downloads
          path: site/downloads/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
